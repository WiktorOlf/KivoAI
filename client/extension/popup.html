<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>KivoAI</title>
    </head>

    <body>
        <h2>KivoAI</h2>

        <button id="scan">
            Scan Page
        </button>

        <hr>

        <h3>Open WebUI</h3>

        <label for="apiKey">
            API Key
        </label>

        <br>

        <input
            id="apiKey"
            type="password"
            placeholder="sk-..."
            style="width: 100%;"
        >

        <br>
        <br>

        <button id="saveSettings">
            Save API Key
        </button>

        <button id="testConnection">
            Connect
        </button>

        <br>
        <br>

        <button id="advancedSettings">
            Advanced Settings
        </button>

        <div id="advancedPanel" style="display: none;">
            <hr>

            <h3>Advanced Settings</h3>

            <label for="serverUrl">
                Open WebUI Server
            </label>

            <br>

            <input
                id="serverUrl"
                type="url"
                style="width: 100%;"
            >

            <br>
            <br>

            <label for="model">
                Model
            </label>

            <br>

            <select
                id="model"
                style="width: 100%;"
            >
                <option value="">
                    Select a model
                </option>
            </select>

            <br>
            <br>

            <button id="fetchModels">
                Fetch Models
            </button>

            <button id="saveAdvancedSettings">
                Save Settings
            </button>

            <br>
            <br>

            <button id="closeAdvancedSettings">
                ← Back
            </button>
        </div>

        <p id="settingsStatus"></p>

        <hr>

        <div id="result"></div>

        <script
            type="module"
            src="src/popup.js"
        ></script>
    </body>
</html>
