<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>KivoAI</title>
    </head>

    <body>
        <h2>KivoAI</h2>

        <button id="scan">
            Scan Page
        </button>

        <hr>

        <h3>Open WebUI</h3>

        <label for="serverUrl">
            Server URL
        </label>

        <br>

        <input
            id="serverUrl"
            type="url"
            placeholder="https://openwebui.example.com"
            style="width: 100%;"
        >

        <br>
        <br>

        <label for="apiKey">
            API Key
        </label>

        <br>

        <input
            id="apiKey"
            type="password"
            placeholder="sk-..."
            style="width: 100%;"
        >

        <br>
        <br>

        <label for="model">
            Model
        </label>

        <br>

        <input
            id="model"
            type="text"
            placeholder="Model name"
            style="width: 100%;"
        >

        <br>
        <br>

        <button id="saveSettings">
            Save Settings
        </button>

        <button id="testConnection">
            Test Connection
        </button>

        <p id="settingsStatus"></p>

        <hr>

        <div id="result"></div>

        <script
            type="module"
            src="src/popup.js"
        ></script>
    </body>
</html>
