<!DOCTYPE html>

<html>
    <head>
        <meta charset="utf-8">
        <title>Microphone Authorization - KivoAI</title>
        <style>
            body {
            background: #0f0f1b;
            color: #f1f2fe;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            }
            .card {
            background: #171728;
            border: 1px solid #2e2f4f;
            padding: 32px;
            border-radius: 12px;
            max-width: 400px;
            }
            button {
            background: #6366f1;
            color: #fff;
            border: none;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 16px;
            }
            button:hover { background: #4f46e5; }
        </style>
    </head>

    <body>
        <div class="card">
            <h2>Microphone Permission Required</h2>
            <p>Click below and select <strong>Allow</strong> in the browser prompt to enable STT dictation for KivoAI.</p>
            <button id="btnGrant">Enable Microphone</button>
        </div>
        <script src="src/permission.js"></script>
    </body>
</html>
